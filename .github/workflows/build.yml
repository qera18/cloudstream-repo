name: Build Plugins

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.jpg"
      - "**/*.png"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build CloudStream plugins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle project
        run: ./gradlew projects --no-daemon --stacktrace

      - name: Build CloudStream plugin
        run: ./gradlew :Animecix:make --no-daemon --stacktrace

      - name: Upload release artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cloudstream-animecix-release
          path: Animecix/build/*.cs3
          if-no-files-found: error
          retention-days: 14
