name: Build CloudStream Plugins
concurrency:
  group: build
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - "*.md"
      - "plugins.json"
      - "repo.json"
      - "**/*.cs3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.4'
      - uses: android-actions/setup-android@v3
      - run: gradle wrapper --gradle-version 8.14.4 --distribution-type bin
      - run: |
          chmod +x gradlew
          ./gradlew build
      - run: |
          for f in */build/*.cs3; do
            [ -f "$f" ] || continue
            dir=$(dirname "$f")
            module=${dir%/build}
            mkdir -p "$module"
            cp "$f" "$module/$(basename "$f")"
          done
      - name: Commit .cs3 outputs
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A -- "*.cs3" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No .cs3 files to commit"
          else
            git commit -m "chore: build .cs3 artifacts"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin HEAD:main
          fi
