name: Build Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin builds:refs/remotes/origin/builds || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle permissions
        run: chmod +x gradlew

      - name: List projects
        run: ./gradlew projects --no-daemon

      - name: Build plugins
        run: ./gradlew make makePluginsJson --no-daemon

      - name: Verify artifacts
        id: artifacts
        run: |
          set -euo pipefail
          cs3=$(find . -type f -name '*.cs3' -size +0c | head -n 1)
          if [ -z "$cs3" ]; then
            echo "HATA: .cs3 dosyasi bulunamadi"; exit 1
          fi
          plugins_json=$(find . -type f -name 'plugins.json' -size +0c | head -n 1)
          repo_json=$(find . -type f -name 'repo.json' -size +0c | head -n 1)
          if [ -z "$plugins_json" ]; then
            echo "HATA: plugins.json bos veya yok"; exit 1
          fi
          if [ -z "$repo_json" ] || ! jq empty "$repo_json" 2>/dev/null; then
            echo "HATA: repo.json gecersiz"; exit 1
          fi
          echo "cs3=$cs3" >> "$GITHUB_OUTPUT"
          echo "plugins_json=$plugins_json" >> "$GITHUB_OUTPUT"
          echo "repo_json=$repo_json" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/cloudstream-artifacts"
          find . -type f -name '*.cs3' -size +0c -exec cp -f {} "$RUNNER_TEMP/cloudstream-artifacts/" \;
          cp -f "$plugins_json" "$RUNNER_TEMP/cloudstream-artifacts/plugins.json"
          cp -f "$repo_json" "$RUNNER_TEMP/cloudstream-artifacts/repo.json"

      - name: Commit to builds branch
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git checkout -B builds refs/remotes/origin/builds
          else
            git checkout -B builds main
          fi
          rm -f *.cs3 plugins.json repo.json || true
          cp -f "$RUNNER_TEMP/cloudstream-artifacts/"*.cs3 .
          cp -f "$RUNNER_TEMP/cloudstream-artifacts/plugins.json" plugins.json
          cp -f "$RUNNER_TEMP/cloudstream-artifacts/repo.json" repo.json
          git add -f *.cs3 plugins.json repo.json
          git commit -m "Publish built plugins" || echo "nothing to commit"
          git push origin builds

      - name: Verify published raw URLs
        run: |
          set -euo pipefail
          for f in repo.json plugins.json; do
            url="https://raw.githubusercontent.com/qera18/cloudstream-repo/builds/$f"
            curl --fail --location --retry 3 --retry-delay 2 "$url" -o "/tmp/$f"
            test -s "/tmp/$f"
          done
          jq -e '.pluginLists | type == "array" and length > 0' /tmp/repo.json
          jq -e 'type == "array" and length > 0' /tmp/plugins.json
          while read -r url; do
            curl --fail --location --retry 3 --retry-delay 2 "$url" -o /tmp/plugin.cs3
            test -s /tmp/plugin.cs3
          done < <(jq -r '.[].url' /tmp/plugins.json)
