name: Build CloudStream Plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List projects
        run: ./gradlew projects --no-daemon

      - name: Build plugins
        run: ./gradlew make --no-daemon

      - name: Generate plugins.json
        run: ./gradlew makePluginsJson --no-daemon

      - name: Verify artifacts
        run: |
          if ! find . -name "*.cs3" | grep -q .; then
            echo "::error::cs3 dosyası bulunamadı"
            exit 1
          fi
          if [ ! -s build/plugins.json ]; then
            echo "::error::plugins.json boş"
            exit 1
          fi

      - name: Generate repo.json
        run: |
          mkdir -p build
          cat > build/repo.json <<'EOF'
{
  "name": "CloudStream Repository",
  "description": "Automatically generated CloudStream plugins",
  "manifestVersion": 1,
  "pluginLists": [
    "https://raw.githubusercontent.com/qera18/cloudstream-repo/builds/plugins.json"
  ]
}
          EOF

      - name: Deploy to builds branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin
          git checkout builds 2>/dev/null || git checkout -b builds origin/builds
          git rm -rf . || true
          find . -name "*.cs3" -exec cp {} . \;
          cp build/plugins.json .
          cp build/repo.json .
          git add .
          git commit -m "Deploy build artifacts" || exit 0
          git push origin builds

      - name: Verify raw URLs
        run: |
          sleep 5
          curl -fL https://raw.githubusercontent.com/qera18/cloudstream-repo/builds/repo.json || exit 1
          curl -fL https://raw.githubusercontent.com/qera18/cloudstream-repo/builds/plugins.json || exit 1
