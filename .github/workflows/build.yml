name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          chmod +x ./gradlew
          ./gradlew make --no-daemon

      - name: Collect plugins
        run: |
          mkdir -p builds
          # Derlenen .cs3 eklenti dosyalarını ve otomatik oluşturulan plugins.json manifestini toplar
          find . -maxdepth 3 -type f \( -name "*.cs3" -o -name "plugins.json" \) -exec cp {} builds/ \;

      - name: Publish to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: builds
          publish_branch: builds
