name: CloudStream Derleyici

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"

jobs:
  CloudStreamDerleyici:
    runs-on: ubuntu-latest
    steps:
      - name: "'src' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "src"

      - name: "'build' Depo Kontrolü"
        uses: actions/checkout@v4.2.2
        with:
          path: "builds"
          ref: "builds"
          continue-on-error: true

      - name: Eski Derlemeleri Temizle
        run: rm -f ${GITHUB_WORKSPACE}/builds/*.cs3 || true

      - name: JDK 17 Ayarla
        uses: actions/setup-java@v4.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK Ayarla
        uses: android-actions/setup-android@v3.2.2

      - name: Eklentileri Derle
        run: |
          cd ${GITHUB_WORKSPACE}/src
          chmod +x gradlew
          ./gradlew make --no-daemon --stacktrace

      - name: Derlenen Eklentileri Kopyala
        run: |
          # Derlenen .cs3 dosyalarını ve üretilen plugins.json manifestini builds klasörüne taşır
          find ${GITHUB_WORKSPACE}/src -type f \( -name "*.cs3" -o -name "plugins.json" \) -exec cp {} ${GITHUB_WORKSPACE}/builds/ \;

      - name: Derlemeleri Yükle
        run: |
          cd ${GITHUB_WORKSPACE}/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "${GITHUB_SHA::7} derlemesi" || echo "Nothing to commit"
          git push --set-upstream origin builds --force
